<!DOCTYPE html>
<html lang="en" data-theme="standard">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="theme-color" content="#202b34">
 <title>Dora Drill Control · OpenPong</title>
 <link rel="stylesheet" href="css/style.css?v=dora-standalone-v1">
</head>
<body>
 <div class="container">
  <header>
   <h1>Dora Drill Control</h1>
   <button class="menu-btn" type="button" onclick="toggleMenu()" aria-label="Open settings menu">☰</button>
  </header>
  <div id="theme-menu" class="theme-menu">
   <div class="menu-title">Theme</div>
   <div class="theme-item" onclick="setTheme('standard')">Standard</div>
   <div class="theme-item" onclick="setTheme('ocean')">Ocean</div>
   <div class="theme-item" onclick="setTheme('forest')">Forest</div>
   <div class="theme-item" onclick="setTheme('night')">Dark</div>
   <div style="border-top:1px solid var(--border);margin:8px 0"></div>
   <div class="theme-item" onclick="resetStats()">Reset Statistics</div>
  </div>
  <div class="settings-card">
   <div id="status-text">Disconnected</div>
   <button id="btn-connect" class="btn-connect" type="button">Connect</button>
   <div class="control-pill" style="margin:12px 0 10px;box-shadow:none;background:transparent;padding:0">
    <div class="mode-switch">
     <div class="mode-option active" onclick="setMode('reps',this)" role="button" tabindex="0">Reps</div>
     <div class="mode-option" onclick="setMode('time',this)" role="button" tabindex="0">Time</div>
    </div>
   </div>
   <div class="controls-row">
    <div class="control-pill" id="ui-reps"><label for="input-reps">Balls</label><input type="number" id="input-reps" min="1" max="10000" value="10"></div>
    <div class="control-pill hidden" id="ui-time"><label for="input-time">Time (s)</label><input type="number" id="input-time" min="1" max="3600" step="10" value="60"></div>
   </div>
  </div>
  <footer style="padding:15px 0;text-align:center">
   <div id="stats-display">Balls: 0 | Drills: 0</div>
  </footer>
 </div>
 <script type="module" src="js/main.js?v=dora-standalone-v1"></script>
</body>
</html>
