<!DOCTYPE html>
<html lang="en" data-theme="standard">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="theme-color" content="#202b34">
 <title>Dora Drill Control · OpenPong</title>
 <link rel="stylesheet" href="css/style.css?v=dora-standalone-v6">
</head>
<body>
 <div class="container">
  <header>
   <h1>Dora Drill Control</h1>
   <div class="menu-btn" role="button" tabindex="0" onclick="toggleMenu()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleMenu()}" aria-label="Open settings menu"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></div>
  </header>
  <div id="theme-menu" class="theme-menu">
   <div class="menu-title">Drill</div>
   <div id="dora-export" class="theme-item" role="button" tabindex="0"><span class="color-preview" style="background:var(--text)"></span> Export Drills</div>
   <div id="dora-import" class="theme-item" role="button" tabindex="0"><span class="color-preview" style="background:var(--text)"></span> Import Drills</div>
   <div id="dora-open-settings" class="theme-item" role="button" tabindex="0" onclick="openDoraSettings()">⚙ Device Settings</div>
   <div style="border-top:1px solid var(--border);margin:8px 0"></div>
   <div class="menu-title">Theme</div>
   <div class="theme-item" onclick="setTheme('standard')"><span class="color-preview" style="background:#ff6b4a"></span> Standard</div>
   <div class="theme-item" onclick="setTheme('ocean')"><span class="color-preview" style="background:#0984e3"></span> Ocean</div>
   <div class="theme-item" onclick="setTheme('forest')"><span class="color-preview" style="background:#00b894"></span> Forest</div>
   <div class="theme-item" onclick="setTheme('night')"><span class="color-preview" style="background:#2d3436"></span> Dark</div>
   <div style="border-top:1px solid var(--border);margin:8px 0"></div>
   <div class="theme-item" onclick="resetStats()">Reset Statistics</div>
  </div>
  <input id="dora-import-file" type="file" accept=".json" hidden>
  <section id="dora-settings-page" hidden role="dialog" aria-modal="true" aria-labelledby="dora-settings-title">
   <div id="dora-device-settings-card" class="settings-card" style="width:100%;max-width:440px;margin:30px auto">
    <button type="button" class="dora-settings-close" onclick="closeDoraSettings()" aria-label="Close device settings" title="Close device settings">×</button>
    <h2 id="dora-settings-title">Device Settings</h2>
   </div>
  </section>
  <div id="training-settings-card" class="settings-card">
   <div id="status-text">Disconnected</div>
   <button id="btn-connect" class="btn-connect" type="button">Connect</button>
   <div class="control-pill" style="margin:12px 0 10px;box-shadow:none;background:transparent;padding:0">
    <div class="mode-switch">
     <div class="mode-option active" onclick="setMode('reps',this)" role="button" tabindex="0">Reps</div>
     <div class="mode-option" onclick="setMode('time',this)" role="button" tabindex="0">Time</div>
    </div>
   </div>
   <div class="controls-row">
    <div class="control-pill" id="ui-reps"><label for="input-reps">Balls</label><input type="number" id="input-reps" min="1" max="10000" value="10"></div>
    <div class="control-pill hidden" id="ui-time"><label for="input-time">Time (s)</label><input type="number" id="input-time" min="1" max="3600" step="10" value="60"></div>
   </div>
  </div>
  <footer style="padding:15px 0;text-align:center">
   <div id="stats-display">Balls: 0 | Drills: 0</div>
  </footer>
 </div>
 <script type="module" src="js/main.js?v=dora-standalone-v6"></script>
</body>
</html>
